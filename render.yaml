databases:
  - name: web-tracker-db
    databaseName: webtracker
    user: webtracker
    plan: basic

services:
  - type: web
    name: web-tracker
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run check && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: web-tracker-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: VAULT_KEY
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: MILESTONE_SYNC_MINUTES
        value: "15"
      - key: ENABLE_SCREENSHOTS
        value: "false"
